name: Desplegar backend Firebase del POS

on:
  workflow_dispatch:
    inputs:
      componente:
        description: Verificar identidad sin despliegue o seleccionar componente autorizado
        required: true
        type: choice
        options:
          - verificar
          - funcion
          - reglas
      commit:
        description: SHA completo de main revisado para este despliegue
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: firebase-punto-de-venta-comic-shop-produccion
  cancel-in-progress: false

jobs:
  verificar-revision:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Exigir el commit exacto de la rama protegida
        shell: bash
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == kdnaskrlos/Punto-de-Venta ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$COMMIT" =~ ^[a-f0-9]{40}$ && "$COMMIT" == "$GITHUB_SHA" ]]

  pruebas:
    needs: verificar-revision
    if: inputs.componente != 'verificar'
    uses: ./.github/workflows/verificar-reglas-firestore.yml

  desplegar:
    needs: [verificar-revision, pruebas]
    if: always() && needs.verificar-revision.result == 'success' && (inputs.componente == 'verificar' || needs.pruebas.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: firebase-produccion
    permissions:
      contents: read
      id-token: write
    env:
      CI: 'true'
      FIREBASE_PROJECT: punto-de-venta-comic-shop
    steps:
      - name: Verificar autorización del entorno y parámetros de identidad
        id: objetivo
        shell: bash
        env:
          COMPONENTE: ${{ inputs.componente }}
          FUNCION_APROBADA: ${{ vars.POS_FIREBASE_FUNCION_SHA }}
          REGLAS_APROBADAS: ${{ vars.POS_FIREBASE_REGLAS_SHA }}
          PROVEEDOR: ${{ vars.POS_FIREBASE_WIF_PROVIDER }}
          NUMERO_PROYECTO: ${{ vars.POS_FIREBASE_PROJECT_NUMBER }}
        run: |
          set -euo pipefail
          case "$COMPONENTE" in
            verificar)
              aprobado=''
              objetivo='verificar'
              ;;
            funcion)
              aprobado="$FUNCION_APROBADA"
              objetivo='functions:procesarVentaPos'
              ;;
            reglas)
              aprobado="$REGLAS_APROBADAS"
              objetivo='firestore:rules'
              ;;
            *) exit 1 ;;
          esac
          if [[ "$COMPONENTE" != verificar ]]; then [[ "$aprobado" == "$GITHUB_SHA" ]]; fi
          [[ "$NUMERO_PROYECTO" =~ ^[0-9]+$ ]]
          [[ "$PROVEEDOR" == "projects/$NUMERO_PROYECTO/locations/global/workloadIdentityPools/pos-github/providers/github" ]]
          printf 'selector=%s\n' "$objetivo" >> "$GITHUB_OUTPUT"

      - if: inputs.componente != 'verificar'
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - if: inputs.componente != 'verificar'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Preparar el CLI y revisar el código antes de autenticar
        if: inputs.componente != 'verificar'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          node scripts/copiar-nucleo-ventas.cjs --comprobar
          npm install --prefix "$RUNNER_TEMP/pos-firebase-cli" --no-audit --no-fund --ignore-scripts firebase-tools@15.37.0
          npm ci --prefix funciones --no-audit --no-fund --ignore-scripts

      - name: Identidad temporal de Google Cloud
        id: autenticar
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: punto-de-venta-comic-shop
          workload_identity_provider: ${{ vars.POS_FIREBASE_WIF_PROVIDER }}
          service_account: pos-github-deploy@punto-de-venta-comic-shop.iam.gserviceaccount.com
          create_credentials_file: true
          token_format: access_token

      - name: Verificar intercambio OIDC sin desplegar
        if: inputs.componente == 'verificar'
        shell: bash
        env:
          TOKEN: ${{ steps.autenticar.outputs.access_token }}
        run: |
          set -euo pipefail
          [[ -n "$TOKEN" ]]
          echo 'Autenticación WIF de GitHub a Google Cloud confirmada. Ningún recurso fue desplegado.' >> "$GITHUB_STEP_SUMMARY"

      - name: Inventario de Firestore y respaldo remoto (solo lectura)
        if: inputs.componente == 'verificar'
        shell: bash
        env:
          TOKEN: ${{ steps.autenticar.outputs.access_token }}
        run: |
          set -euo pipefail
          proyecto='punto-de-venta-comic-shop'
          [[ "$FIREBASE_PROJECT" == "$proyecto" && -n "$TOKEN" ]]
          carpeta=$(mktemp -d)
          trap 'rm -rf "$carpeta"' EXIT
          # Solicitudes GET: no modifica datos, reglas, backups ni servicios.
          for intento in database backups; do
            if [[ "$intento" == database ]]; then
              url="https://firestore.googleapis.com/v1/projects/$proyecto/databases/%28default%29"
            else
              url="https://firestore.googleapis.com/v1/projects/$proyecto/locations/-/backups"
            fi
            codigo=$(curl --silent --show-error --max-time 30 --retry 2 --retry-delay 2 \
              --output "$carpeta/$intento.json" --write-out '%{http_code}' \
              --header "Authorization: Bearer $TOKEN" --header "Accept: application/json" "$url")
            if [[ "$codigo" != 200 ]]; then
              echo "::error::Consulta de metadatos $intento falló (HTTP $codigo). Verificar permisos de lectura, sin otorgar privilegios de escritura."
              exit 1
            fi
          done
          python3 - "$carpeta/database.json" "$carpeta/backups.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path
          database = json.loads(Path(sys.argv[1]).read_text())
          backups = json.loads(Path(sys.argv[2]).read_text())
          expected = "projects/punto-de-venta-comic-shop/databases/(default)"
          if database.get("name") != expected or database.get("type") != "FIRESTORE_NATIVE":
              raise SystemExit("BLOQUEADO: ubicación/proyecto/tipo de base de datos inesperado")
          if backups.get("unreachable"):
              raise SystemExit("BLOQUEADO: algunas ubicaciones de respaldos no pudieron consultarse")
          ready = [b for b in backups.get("backups", []) if b.get("database") == expected
                   and b.get("state") == "READY" and b.get("expireTime")
                   and datetime.fromisoformat(b["expireTime"].replace("Z", "+00:00")) > datetime.now(timezone.utc)]
          location = database.get("locationId", "desconocida")
          with open(sys.argv[3], "a") as out:
              out.write("### Preflight Firestore (solo lectura)\n\n")
              out.write(f"- Base: `(default)` / `{location}` (FIRESTORE_NATIVE).\n")
              if ready:
                  latest = max(ready, key=lambda b: b.get("snapshotTime", ""))
                  out.write(f"- Respaldo vigente READY: `{latest['name']}`.\n")
                  out.write(f"- Fecha del respaldo: `{latest.get('snapshotTime', 'sin fecha')}`.\n")
              else:
                  out.write("- Respaldo: **ninguna copia READY detectada**. El propietario acepta pruebas sintéticas sin respaldo en un POS todavía no operativo.\n")
                  print("AVISO: no se encontró copia READY. No se bloquea este chequeo de solo lectura.")
              out.write("- Sin escrituras ni despliegue; no valida las reglas publicadas ni los datos de las colecciones.\n")
          print("Preflight de base Firestore: correcto (solo metadatos)")
          PY

      - name: Desplegar solamente el componente autorizado
        if: inputs.componente != 'verificar'
        shell: bash
        env:
          OBJETIVO: ${{ steps.objetivo.outputs.selector }}
        run: |
          set -euo pipefail
          [[ "$FIREBASE_PROJECT" == punto-de-venta-comic-shop ]]
          case "$OBJETIVO" in functions:procesarVentaPos|firestore:rules) ;; *) exit 1 ;; esac
          "$RUNNER_TEMP/pos-firebase-cli/node_modules/.bin/firebase" deploy \
            --project "$FIREBASE_PROJECT" --config firebase.ventas.json --only "$OBJETIVO" --non-interactive
