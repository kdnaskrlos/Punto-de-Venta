name: Preparar sitio PWA v2.36 (sin despliegue)
on:
  push:
    branches:
      - transfer/puente-pwa-pr3
    paths:
      - .github/workflows/preparar-pos-v236.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar pruebas de núcleo y datos
        run: npm test
      - name: Verificar fuente del puente
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/preparar-publicacion.cjs
          test -f js/arranque-pwa.js
          test -f js/nucleo/ejemplos.js
          node pruebas/pwa/huella.cjs
      - name: Construir publicación estática
        id: build
        shell: bash
        run: |
          set -euo pipefail
          node scripts/preparar-publicacion.cjs "$RUNNER_TEMP/sitio" | tee "$RUNNER_TEMP/publicacion.json"
          node --input-type=module -e '
            import fs from "node:fs";
            import path from "node:path";
            const dest=process.env.RUNNER_TEMP+"/sitio";
            const meta=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/publicacion.json","utf8"));
            const requeridos=["index.html","sw.js","config.js","js/nucleo/ejemplos.js",
              "manifest.webmanifest","fotos",meta.prefijo+"index.html",
              meta.prefijo+"js/principal.js",meta.prefijo+"js/version.js",
              meta.prefijo+"js/arranque-pwa.js"];
            const faltan=requeridos.filter(p=>!fs.existsSync(path.join(dest,p)));
            if(faltan.length)throw new Error("Faltan recursos: "+faltan.join(", "));
            const sw=fs.readFileSync(path.join(dest,"sw.js"),"utf8");
            if(!sw.includes(meta.huella)||!sw.includes(meta.prefijo))throw new Error("Worker no coincide con artefacto");
            if(!fs.readFileSync(path.join(dest,"index.html"),"utf8").includes(meta.prefijo))
              throw new Error("HTML sin rutas versionadas");
            if(!meta.prefijo.startsWith("versiones/v2.36-"))throw new Error("Version incorrecta");
            console.log("Artefacto verificado:",meta.prefijo,meta.huella);
          '
      - name: Crear rama de publicación independiente
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin refs/heads/release/pos-v2.36 >/dev/null; then
            echo "La rama de publicación ya existe. No se sobrescribirá."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan publicar-v236
          git rm -rf --ignore-unmatch . || true
          cp -a "$RUNNER_TEMP/sitio/." .
          git add -A -f
          git commit -m "build: artefacto PWA v2.36 listo para Pages"
          git push origin HEAD:refs/heads/release/pos-v2.36
          echo "Rama release/pos-v2.36 creada. No se modificó main ni se desplegó Pages."
