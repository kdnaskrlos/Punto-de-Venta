name: Transferencia verificada del puente PWA
on:
  push:
    branches:
      - transfer/puente-pwa-pr3
    paths:
      - .transfer/puente-pwa-pr3.patch.xz.b64
permissions:
  contents: write
jobs:
  aplicar-parche:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Verificar y aplicar exclusivamente el puente
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c45451796cc0d1481b27829062890cdf562d8e34"
          base64 --decode .transfer/puente-pwa-pr3.patch.xz.b64 > /tmp/puente.patch.xz
          echo '47f65d89b319aebfa8c217d461e1b94b99ab7fbe1fb7a913846494bd47d1df1b  /tmp/puente.patch.xz' | sha256sum -c -
          xz -dc /tmp/puente.patch.xz > /tmp/puente.patch
          echo '12caacac9ad6238cfd219e2bec8dc79e53f93f3f4cb2a27427a53a0790982c26  /tmp/puente.patch' | sha256sum -c -
          git apply --check --index /tmp/puente.patch
          git apply --index /tmp/puente.patch
          git rm -f .transfer/puente-pwa-pr3.patch.xz.b64 .github/workflows/transfer-pwa.yml
          git add -A
          test "$(git write-tree)" = "97eccf360233894b0f4ac50116bfeb223e0b91f3"
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(pwa): recuperar puente de compatibilidad validado"
          git push origin HEAD:refs/heads/transfer/puente-pwa-pr3
